<div class="main-content">

  <!-- BREADCRUMB -->
  <nav class="strix-breadcrumb" aria-label="breadcrumb">
    <a href="#"><i class="bi bi-house-fill"></i></a>
    <span class="sep">/</span>
    <span class="current">Roles de Usuario</span>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div>
      <h1><i class="bi bi-shield" style="color:var(--strix-orange);margin-right:.4rem;"></i>Roles de Usuario</h1>
      <div style="font-size:.78rem;color:var(--strix-muted);margin-top:.15rem;">Gestión de roles y permisos</div>
    </div>
    <button class="btn-strix-sm" (click)="toggleFormulario()">
      <i class="bi bi-plus-lg"></i> Nuevo Rol
    </button>
  </div>

  <!-- FORMULARIO INSERTAR -->
  <div class="strix-card" *ngIf="mostrarFormulario">
    <div class="strix-card-header">
      <div class="strix-card-title">
        <i class="bi bi-plus-circle"></i> Nuevo Rol
      </div>
    </div>
    <div class="strix-card-body">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label class="strix-label">Administrador</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="nuevoRol.administrador" placeholder="Nombre del rol administrador"/>
        </div>
        <div class="col-12 col-md-4">
          <label class="strix-label">Trabajador</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="nuevoRol.trabajador" placeholder="Nombre del rol trabajador"/>
        </div>
        <div class="col-12 col-md-4">
          <label class="strix-label">Otros Usuarios</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="nuevoRol.otros_usuarios" placeholder="Nombre de otros roles"/>
        </div>
        <div class="col-12" style="display:flex;gap:.5rem;justify-content:flex-end;">
          <button class="btn-strix-sm" (click)="insertar()">
            <i class="bi bi-save"></i> Guardar
          </button>
          <button class="btn-strix-sm" style="background:var(--strix-border);"
                  (click)="toggleFormulario()">
            <i class="bi bi-x-lg"></i> Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- FORMULARIO EDITAR -->
  <div class="strix-card" *ngIf="mostrarFormularioEditar">
    <div class="strix-card-header">
      <div class="strix-card-title">
        <i class="bi bi-pencil-square"></i> Editar Rol
      </div>
    </div>
    <div class="strix-card-body">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label class="strix-label">Administrador</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="rolEditar.administrador"/>
        </div>
        <div class="col-12 col-md-4">
          <label class="strix-label">Trabajador</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="rolEditar.trabajador"/>
        </div>
        <div class="col-12 col-md-4">
          <label class="strix-label">Otros Usuarios</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="rolEditar.otros_usuarios"/>
        </div>
        <div class="col-12" style="display:flex;gap:.5rem;justify-content:flex-end;">
          <button class="btn-strix-sm" (click)="editar()">
            <i class="bi bi-save"></i> Guardar Cambios
          </button>
          <button class="btn-strix-sm" style="background:var(--strix-border);"
                  (click)="mostrarFormularioEditar = false">
            <i class="bi bi-x-lg"></i> Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLA DE ROLES -->
  <div class="strix-card">
    <div class="strix-card-header">
      <div class="strix-card-title">
        <i class="bi bi-list-ul"></i> Lista de Roles
      </div>
    </div>
    <div class="tbl-wrap">
      <table class="strix-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Administrador</th>
            <th>Trabajador</th>
            <th>Otros Usuarios</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of roles ?? []">
            <td style="color:var(--strix-muted);font-size:.75rem;">{{ item.id_rol_usuario }}</td>
            <td>{{ item.administrador }}</td>
            <td>{{ item.trabajador }}</td>
            <td>{{ item.otros_usuarios }}</td>
            <td>
              <div class="tbl-actions">
                <button class="btn-edit" title="Editar"
                        (click)="abrirEditar(item)">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn-del" title="Eliminar"
                        (click)="eliminar(item.id_rol_usuario)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
