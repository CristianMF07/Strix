<div class="main-content">

  <!-- BREADCRUMB -->
  <nav class="strix-breadcrumb" aria-label="breadcrumb">
    <a href="#"><i class="bi bi-house-fill"></i></a>
    <span class="sep">/</span>
    <span class="current">Estado Cliente</span>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div>
      <h1><i class="bi bi-toggle-on" style="color:var(--strix-orange);margin-right:.4rem;"></i>Estado Cliente</h1>
      <div style="font-size:.78rem;color:var(--strix-muted);margin-top:.15rem;">Gestión de estados de clientes</div>
    </div>
    <button class="btn-strix-sm" (click)="toggleFormulario()">
      <i class="bi bi-plus-lg"></i> Nuevo Estado
    </button>
  </div>

  <!-- FORMULARIO INSERTAR -->
  <div class="strix-card" *ngIf="mostrarFormulario">
    <div class="strix-card-header">
      <div class="strix-card-title">
        <i class="bi bi-plus-circle"></i> Nuevo Estado
      </div>
    </div>
    <div class="strix-card-body">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="strix-label">Estado</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="nuevoEstado.estado" placeholder="Ej: Activo, Inactivo..."/>
        </div>
        <div class="col-12" style="display:flex;gap:.5rem;justify-content:flex-end;">
          <button class="btn-strix-sm" (click)="insertar()">
            <i class="bi bi-save"></i> Guardar
          </button>
          <button class="btn-strix-sm" style="background:var(--strix-border);"
                  (click)="toggleFormulario()">
            <i class="bi bi-x-lg"></i> Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- FORMULARIO EDITAR -->
  <div class="strix-card" *ngIf="mostrarFormularioEditar">
    <div class="strix-card-header">
      <div class="strix-card-title">
        <i class="bi bi-pencil-square"></i> Editar Estado
      </div>
    </div>
    <div class="strix-card-body">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="strix-label">Estado</label>
          <input type="text" class="strix-input form-control"
                 [(ngModel)]="estadoEditar.estado"/>
        </div>
        <div class="col-12" style="display:flex;gap:.5rem;justify-content:flex-end;">
          <button class="btn-strix-sm" (click)="editar()">
            <i class="bi bi-save"></i> Guardar Cambios
          </button>
          <button class="btn-strix-sm" style="background:var(--strix-border);"
                  (click)="mostrarFormularioEditar = false">
            <i class="bi bi-x-lg"></i> Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLA DE ESTADOS -->
  <div class="strix-card">
    <div class="strix-card-header">
      <div class="strix-card-title">
        <i class="bi bi-list-ul"></i> Lista de Estados
      </div>
    </div>
    <div class="tbl-wrap">
      <table class="strix-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of estados ?? []">
            <td style="color:var(--strix-muted);font-size:.75rem;">{{ item.id_estado }}</td>
            <td><strong>{{ item.estado }}</strong></td>
            <td>
              <div class="tbl-actions">
                <button class="btn-edit" title="Editar"
                        (click)="abrirEditar(item)">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn-del" title="Eliminar"
                        (click)="eliminar(item.id_estado)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
